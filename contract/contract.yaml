# Quackoscope wire contract. The single source of truth for the
# frontend/backend boundary: one WebSocket, a JSON control plane and a binary
# sample plane.
#
# This file is DATA. It is read by tools/contract-compiler, which emits the
# generated/<target>/ trees. Nothing here is prose that a generator has to
# interpret: every casing join, every acronym rendering, every optionality and
# nullability decision, every per-operation error subset and every lint is a
# machine-readable field.
#
# Operation names are stored as ordered token lists. Casing is a join, applied
# by the generator per target. The wire join is snake_case and is frozen
# forever.

contract:
  name: quackoscope-wire-contract
  protocol_version: "1.0"
  wire_transport: websocket
  wire_control_plane: json_text
  wire_sample_plane: binary_frame
  wire_join: snake_case
  wire_join_frozen: true

# ---------------------------------------------------------------------------
# 1. Naming and casing
# ---------------------------------------------------------------------------
#
# join values, all defined over an ordered token list of lowercase ASCII words:
#   snake_case  every token lowercased, joined with "_"
#   camelCase   first token lowercased, every later token capitalised, no
#               separator
#   PascalCase  every token capitalised, no separator
#
# "capitalised" for a non-acronym token means first letter upper, rest lower.
# For an acronym token the rendering comes from acronym_rendering below, which
# is exhaustive, so a generator never has to infer acronym casing.

casing:

  # Acronym tokens are never split into letters and never split across word
  # boundaries. This list is closed; a token outside it is an ordinary word.
  acronym_tokens: [id, ids, io, lt, ns, rpc, ui, csv]

  targets:

    wire:
      join: snake_case
      getter_prefix: keep_get
      setter_prefix: keep_set
      collapse_getter_setter_pairs: false
      async_style: none
      # Rendering of each acronym token, by position in the token list.
      acronym_rendering:
        leading:     {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
        non_leading: {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
      reserved_words: []
      reserved_word_strategy: none

    cpp:
      join: camelCase
      getter_prefix: keep_get
      setter_prefix: keep_set
      collapse_getter_setter_pairs: false
      async_style: callback_or_future
      acronym_rendering:
        leading:     {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
        non_leading: {id: Id,  ids: Ids, io: Io, lt: Lt, ns: Ns, rpc: Rpc, ui: Ui, csv: Csv}
      # bool, int, float and struct are here because they are the values of the
      # PropertyDescriptor.value_type enum AND C++ keywords: without them the
      # generated enum members do not compile. Found by compiling the generated
      # header with MSVC.
      reserved_words: [type, id, object, input, next, match, ref, async, default, class, template, operator, namespace, bool, int, float, struct]
      reserved_word_strategy: suffix_underscore   # default -> default_

    csharp:
      join: PascalCase
      getter_prefix: keep_get
      setter_prefix: keep_set
      collapse_getter_setter_pairs: true
      async_style: suffix_async
      # C# keeps two-letter acronyms upper and Pascal-cases longer ones.
      acronym_rendering:
        leading:     {id: ID,  ids: Ids, io: IO, lt: LT, ns: NS, rpc: Rpc, ui: UI, csv: Csv}
        non_leading: {id: ID,  ids: Ids, io: IO, lt: LT, ns: NS, rpc: Rpc, ui: UI, csv: Csv}
      reserved_words: [type, id, object, input, next, match, ref, async, default, event, params, base, lock, string, int, bool, float]
      reserved_word_strategy: prefix_at           # default -> @Default

    python:
      join: snake_case
      getter_prefix: keep_get
      setter_prefix: keep_set
      collapse_getter_setter_pairs: true
      async_style: async_def
      acronym_rendering:
        leading:     {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
        non_leading: {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
      reserved_words: [type, id, object, input, next, match, async, class, def, lambda, from, import, None, True, False]
      reserved_word_strategy: suffix_underscore   # type -> type_

    rust:
      join: snake_case
      getter_prefix: strip_leading_get   # [get, property, value] -> property_value
      setter_prefix: keep_set
      collapse_getter_setter_pairs: false
      async_style: async_fn
      acronym_rendering:
        leading:     {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
        non_leading: {id: id,  ids: ids, io: io, lt: lt, ns: ns, rpc: rpc, ui: ui, csv: csv}
      reserved_words: [type, ref, async, match, default, fn, mod, impl, trait, crate, self, move, loop]
      reserved_word_strategy: prefix_raw_identifier   # type -> r#type

  # strip_leading_get is a no-op when the token list does not begin with "get".
  # [list, function, block, types] is kind=getter and stays list_function_block_types
  # in rust.
  getter_prefix_semantics:
    keep_get: emit the token list unchanged
    strip_leading_get: drop a leading "get" token when present, otherwise unchanged

  # Every operation on this contract is a network round trip, so async_style
  # applies to every generated client call symbol, not to a subset.
  async_style_applies_to: all_operations

  # Getter/setter collapse. A pair may collapse into a C# property or a Python
  # @property only when the collapsed symbol can carry the same information as
  # the two wire calls, i.e. the accessor needs no arguments of its own.
  getter_setter_pairing:
    # A getter G and a setter S pair when their token lists are identical after
    # dropping the leading get/set token. Capability is NOT part of the
    # predicate: the one pair in this contract deliberately spans two
    # capabilities, property.read and property.write, because reading and
    # writing are separately grantable.
    pair_predicate:
      tokens_equal_after_dropping_leading_verb: true
      capability_equal: false
    # A paired getter/setter may only be COLLAPSED into a single property-like
    # symbol when both hold:
    collapse_predicate:
      getter_params_count: 0
      setter_params: [value]
    # Pairs that match pair_predicate but fail collapse_predicate stay two
    # separate call symbols in every target, including C# and Python.
    on_pair_without_collapse: emit_two_call_symbols
    pairs:
      - getter: [get, property, value]
        setter: [set, property, value]
        getter_capability: property.read
        setter_capability: property.write
        collapses: false
        collapse_blocked_by: >-
          the getter takes node_id and property_id, so no zero-argument
          accessor can express it; a C# property and a Python @property cannot
          carry those arguments

  # The collapse above breaks the one-to-one wire mapping, so the generator
  # emits a symbol list per target in which every symbol records the wire
  # methods it covers. The naming lint runs against covers_wire_methods, never
  # against a casing transform of a single wire name.
  symbol_list:
    emitted_per_target: true
    path: generated/<target>/symbol-list.json
    entry_fields:
      symbol: {type: string, required: true}
      kind: {type: enum, values: [call, property, event, type], required: true}
      covers_wire_methods: {type: array_of_string, required: true, min_items: 1}
      naming_override_reason: {type: string, required: false}

  # Per-language overrides live on the operation, under naming_overrides.
  # A reason is mandatory; the compiler fails the build on an override without
  # a non-empty reason.
  naming_override_schema:
    location: operations[].naming_overrides.<target>
    fields:
      symbol: {type: string, required: true}
      reason: {type: string, required: true, min_length: 1}
    reason_required: true
    on_missing_reason: fail_build

# ---------------------------------------------------------------------------
# 2. Error codes: a closed set
# ---------------------------------------------------------------------------

error_codes:
  closed: true
  values: [not_found, not_connected, invalid_value, read_only, unsupported, timeout, internal]

error_shape:
  fields:
    code:
      type: enum
      enum_ref: error_codes
      presence: required
      client_may_branch_on: true
    detail:
      type: string
      presence: required
      client_may_branch_on: false
      purpose: display_and_logs_only
      origin: native exception text, opaque, never parsed

error_policy:
  # Native exceptions map into the closed set. Native messages ride along in
  # detail as opaque text.
  native_exception_mapping: required
  unmapped_native_error_becomes: internal
  frontend_branches_on: code

  # invalid_value ALSO MEANS "A PARAMETER VIOLATED ITS DECLARED WIRE TYPE", and
  # this is one shared definition rather than a sentence repeated on every row,
  # because the cause is the wire decoder and never the SDK. When node_id
  # arrives as 17, or as [], or as null, openDAQ IS NEVER REACHED: there is no
  # SDK entry point that can accept the value.
  #   - a node lookup is IComponent::findComponent(IString* id, IComponent** out)
  #     (component_impl.h:904-928). The parameter is IString*. An integer is not
  #     an IString* and cannot be made into one. A null id would be
  #     OPENDAQ_PARAM_NOT_NULL(id) at component_impl.h:906-907, expanding
  #     (coretypes/validation.h:30-31) to OPENDAQ_ERR_ARGUMENT_NULL; a
  #     well-formed id naming nothing returns OPENDAQ_NOTFOUND
  #     (component_impl.h:924, errors.h:39).
  #   - IRecorder::startRecording (recorder.h:45), IServer::enableDiscovery
  #     (server.h:66), IServer::disableDiscovery (server.h:90) and
  #     IPropertyObject::beginUpdate take NO ARGUMENTS AT ALL, so a malformed
  #     argument has nowhere to arrive.
  # openDAQ keeps "you gave me the wrong type" strictly apart from "I could not
  # find it" and has four codes for the first: OPENDAQ_ERR_INVALIDPARAMETER
  # (errors.h:46), OPENDAQ_ERR_INVALIDVALUE (:75), OPENDAQ_ERR_INVALIDTYPE (:77,
  # used for exactly this - "Selection item type mismatch" at
  # property_object_impl.h:2243, "List item type mismatch" at :2255) and
  # OPENDAQ_ERR_ARGUMENT_NULL (:91). A subset that offers only not_found forces
  # a host to collapse the two, and not_found asserts a lookup happened and
  # failed, which is a claim about openDAQ that the host cannot support. Every
  # row whose parameters can be malformed therefore declares invalid_value.
  malformed_parameter_becomes: invalid_value

# ---------------------------------------------------------------------------
# 3. Types
# ---------------------------------------------------------------------------
#
# presence values, which are the whole optionality/nullability story:
#   required        the JSON key is always present and never null
#   nullable        the JSON key is always present and may be null
#   optional        the JSON key may be absent; when present it is not null
#   optional_null   the JSON key may be absent and may be null when present
#
# Type-record fields never use "optional": a host emits every key of a type
# record, writing null where a value is absent. Operation params use "optional"
# for arguments a caller may leave out entirely.

types:

  DeviceInfo:
    kind: record
    fields:
      connection_string: {type: string, presence: required}
      name:              {type: string, presence: required}
      serial:            {type: string, presence: nullable}

  # Node carries the per-row state the tree draws as the bracketed suffix
  # [inactive, disconnected, locked], the row colour, and the device row's
  # " | <operation mode>" suffix. These are fields rather than an operation of
  # their own because Node already crosses the wire on every tree read, on
  # connect_device, on add_function_block and in the component_added event, so a
  # row's state costs no extra round trip, whereas a per-node state operation
  # would cost one request per row to draw a tree.
  #
  # Every state field is nullable, and null means "this host does not report
  # it", which the client draws as no suffix and no colour. That is exactly what
  # the reference does: gui_demo.py _build_component_state_labels wraps every
  # read in try/except and appends no label when the read raises. A host that
  # cannot determine a field writes null rather than guessing a value.
  #
  # component_status, component_status_message and connection_status are named
  # after the two keys openDAQ's own status container is read with:
  # status_container.get_status("ComponentStatus") /
  # get_status_message("ComponentStatus"), and get_status("ConnectionStatus").
  # Their enum values are openDAQ's, lowercased into the frozen wire join:
  # ComponentStatusType is (Ok, Warning, Error), ConnectionStatusType is
  # (Connected, Reconnecting, Unrecoverable, Removed) and OperationModeType is
  # (Unknown, Idle, Operation, SafeOperation).
  Node:
    kind: record
    fields:
      id:           {type: string, presence: required}
      name:         {type: string, presence: required}
      # `server` is a real node kind, not a convenience. gui_demo.py's
      # tree_add_component gives IServer its own icon branch beside channel,
      # signal, function block, input port, device and folder, and menu_groups
      # dispatches an IServer node to menu_server_groups rather than to the
      # device or the function-block menu. Without it the client cannot tell a
      # server row from a folder row, and the row menu cannot choose the
      # discovery items BY NODE KIND, which is what the row-menu ruling requires.
      #
      # It is also what add_server's return type forces: that operation returns
      # the Node it created, the way connect_device and add_function_block do,
      # and the created thing is a server. A NodeKind without `server` would make
      # add_server return a record it cannot describe.
      #
      # WHAT THIS ENUM STILL DOES NOT HAVE, stated rather than left to be
      # discovered: input_port. The reference draws input ports in its tree and
      # ComponentAttribute below declares the three attributes an IInputPort
      # carries, but no value here names one, so no tree row today selects an
      # input port. That is a tree question - which components the tree read
      # returns - and it is not answered by the attributes work that raised it.
      kind:         {type: enum, values: [device, channel, function_block, signal, folder, server], presence: required}
      parent_id:    {type: string, presence: nullable, references: Node.id}
      child_ids:    {type: array, items: string, presence: required, references: Node.id}
      property_ids: {type: array, items: string, presence: required, references: PropertyDescriptor.id}
      # IComponent.active. false draws the [inactive] label.
      active:                   {type: bool, presence: nullable}
      # The EFFECTIVE lock state, inheritance already applied host-side: a
      # device reports its own IDevice.locked, and any other component reports
      # the nearest ancestor device's, which is what the reference computes
      # client-side in _set_node_lock_status_recursive. true draws [locked].
      # lock_device and unlock_device act on device rows only.
      #
      # THIS IS A LABEL, NOT A WRITE REFUSAL, and a client must not infer one
      # from it. The reference's entire consequence for a locked node is
      # add_tag_and_configure(node, 'locked', 'gray') plus the [locked] suffix
      # (gui_demo.py:1447-1471 and :655-657); it disables neither the property
      # editor nor the attribute editor. openDAQ agrees: the lock is enforced in
      # the config-protocol SERVER, by
      # ConfigServerAccessControl::protectLockedComponent
      # (config_server_access_control.h:75-81, called from
      # config_server_component.h:78, :298 and :317), and nowhere in core -
      # GenericPropertyObjectImpl::setPropertyValue consults no lock, so an
      # in-process device.setPropertyValue on a locked device SUCCEEDS.
      locked:                   {type: bool, presence: nullable}
      component_status:         {type: enum, values: [ok, warning, error], presence: nullable}
      component_status_message: {type: string, presence: nullable}
      # Device rows only; null on every other kind. Anything other than
      # connected draws the [disconnected] label. The reference reduces this to
      # a bool by comparing the status name to "Connected"; the four states are
      # carried whole because "reconnecting" is worth showing and costs nothing.
      connection_status:        {type: enum, values: [connected, reconnecting, unrecoverable, removed], presence: nullable}
      # Device rows only; null on every other kind. This is the current mode
      # the reference appends to the row name as " | Idle". The AVAILABLE modes
      # are get_device_operation_modes, because only an opened menu needs them.
      operation_mode:           {type: enum, values: [unknown, idle, operation, safe_operation], presence: nullable}
      # IPropertyObject::getUpdating(Bool*), property_object.h:361, whose own
      # doc says it "returns True if `beginUpdate` method has been called on the
      # object and `endUpdate` has not". While that holds, every
      # set_property_value against the component is HELD rather than applied.
      #
      # It is a Node field for the reason every other state field here is one: a
      # per-row fact must not cost a per-row call, and the reference proves this
      # one is per-row by reading it on every row. _set_node_update_status_recursive
      # (gui_demo.py:1434-1445) walks the WHOLE tree, reads node_obj.updating on
      # each component, and paints the row red when it is true - the same shape
      # as the [inactive] and [locked] suffixes the fields above serve.
      #
      # It also does a second job no call can do: it makes an abandoned batch
      # VISIBLE. beginUpdate is recursive over child property objects
      # (property_object.h:335), so one begin on a device puts a subtree into
      # batch mode, and a session that calls begin_batched_property_update and
      # then drops leaves it there for everyone. Carrying `updating` on the tree
      # lets the next session SEE that and say so, instead of writing properties
      # that silently never land. Who may end a batch somebody else began is NOT
      # ruled by this contract - see begin_batched_property_update, which states
      # the question and leaves it open rather than inventing an answer.
      updating:                 {type: bool, presence: nullable}
      # IRecorder::getIsRecording(Bool*), recorder.h:62. Recorder function-block
      # rows only; null on every other kind, exactly as connection_status is
      # null on every non-device row.
      #
      # It is a Node field rather than a get_recorder_state operation because the
      # client's first question is not "is it recording" but "is this node a
      # recorder at all", and that question decides whether the Start/Stop
      # control exists. The reference asks it with a cast:
      # block_view.py:169-171 does daq.IRecorder.can_cast_from(self.node) and
      # builds RecorderView only when the cast succeeds. A cast is free
      # in-process; over a socket the same question costs a round trip whose
      # answer is `unsupported` for the great majority of nodes. Carried here it
      # costs one nullable bool on a record the tree read already returns, and
      # the control is drawn or not drawn with no request at all.
      #
      # null therefore means BOTH "not a recorder" and "this host does not report
      # it", and the client draws no recorder control in either case. That
      # conflation is the same one active, locked and operation_mode already
      # make, and it has the same consequence: a host that declares
      # recorder.control but writes null here shows no control.
      recording:                {type: bool, presence: nullable}

  PropertyDescriptor:
    kind: record
    fields:
      id:               {type: string, presence: required}
      name:             {type: string, presence: required}
      value_type:       {type: enum, values: [bool, int, float, string, selection, struct], presence: required}
      unit:             {type: string, presence: nullable}
      description:      {type: string, presence: nullable}
      read_only:        {type: bool, presence: required}
      visible:          {type: bool, presence: required}
      default:          {type: any, presence: nullable, wire_key_is_language_keyword_in: [cpp, csharp, rust]}
      selection_values: {type: array, items: string, presence: nullable}
      suggested_values: {type: array, items: any, presence: nullable}
      min:              {type: number, presence: nullable}
      max:              {type: number, presence: nullable}
      validator:        {type: string, presence: nullable, content: opendaq_eval_value_source, interpret_client_side: false}
      coercer:          {type: string, presence: nullable, content: opendaq_eval_value_source, interpret_client_side: false}

  # One row of the reference's ATTRIBUTES treeview, which is a different surface
  # from its properties treeview and reads a different thing.
  # gui_demo/components/generic_attributes_treeview.py builds it, and
  # attributes_dialog.py is the 600x800 modal it lives in.
  #
  # ATTRIBUTES ARE NOT PROPERTIES, and this record exists because of that. A
  # property is a PropertyDescriptor the object carries in a property bag and
  # answers get/setPropertyValue for. An attribute is a fixed member of the
  # openDAQ interface itself - IComponent.name, IComponent.description,
  # IComponent.active, IComponent.visible, IComponent.tags, the global and local
  # ids, and the extras a cast reaches: ISignal.public, ISignal.streamed,
  # ISignal.last_value, the domain and related signals, IInputPort.public,
  # IInputPort.signal and IInputPort.requires_signal. The reference writes one
  # with setattr(node, attribute, new_value) (generic_attributes_treeview.py:110),
  # never through the property API, and it draws them in a treeview of their own
  # whose three columns are Name, Value and Locked (lines 33-39).
  #
  # WHY THIS IS A TYPE AND TWO OPERATIONS RATHER THAN FIELDS ON Node. Node's
  # own comment sets the test: a per-row fact must not cost a per-row call.
  # Attributes fail that test in the other direction. The attributes view is a
  # panel over ONE selected component - the reference opens it as a 600x800
  # modal on one node (attributes_dialog.py:16) - so it is a per-panel fact, and
  # it costs one call when the panel opens, which is exactly what
  # get_property_descriptors already does for one node. Putting the fourteen on
  # Node would push fourteen more fields into every one of the N records a tree
  # read returns, to serve a panel that shows one of them. It would also lose
  # two things Node cannot express: the per-attribute read_only flag, which
  # openDAQ computes from IComponent.locked_attributes and the reference folds
  # in at generic_attributes_treeview.py:168-178, and the fact that the
  # attribute SET is not fixed - a signal has five attributes an input port does
  # not, and neither has the other's.
  #
  # WHAT THIS DELIBERATELY DOES NOT CARRY. The reference's last attribute row is
  # 'Status', whose value is dict(node.status_container.statuses.items())
  # (generic_attributes_treeview.py:170-173) - a nested read-only dictionary,
  # which the treeview then nests one level deep under a parent row. It is not a
  # row here, because Node already carries component_status,
  # component_status_message and connection_status, which are the keys openDAQ's
  # own status container is read with, so the panel draws status off the tree
  # read with no call. The honest cost of that choice: a host whose status
  # container holds keys beyond those two loses them on this surface. Carrying
  # them would need a dictionary-valued attribute, and this contract has no
  # nested record value in any type.
  ComponentAttribute:
    kind: record
    fields:
      # The attribute's wire id, in the frozen snake_case join. The fourteen this
      # contract expects, which are the fourteen the reference builds:
      #   name description active global_id local_id tags visible
      #   public domain_signal_id related_signal_ids streamed last_value
      #   signal_id requires_signal
      #
      # Eleven of those are the Python binding's own attribute spelling, which
      # generic_attributes_treeview.py hands straight to setattr. THREE ARE NOT,
      # and saying otherwise would be a claim this contract cannot support: the
      # reference's own Attribute keys there are '.domain_signal',
      # 'related_signals' and 'signal' (lines 148, 151, 164), while the VALUE it
      # puts in each is a global id string - signal.domain_signal.global_id, the
      # global ids of signal.related_signals, input_port.signal.global_id. The
      # wire ids carry the _id/_ids suffix because what crosses the wire is the
      # id, not the object; a host that writes one of these three writes the
      # binding's shorter name against its own SDK.
      #
      # An open string, not an enum, for the same reason PropertyDescriptor.id
      # is: a host reports the attributes it can reach, and a cast it cannot
      # perform simply yields fewer rows.
      id:         {type: string, presence: required}
      # The label the reference prints in the '#0' column: 'Global ID', 'Domain
      # Signal ID', 'Requires Signal'. Carried rather than derived because the
      # reference's labels are not a mechanical transform of the attribute name
      # ('.domain_signal' is drawn as 'Domain Signal ID'), and because
      # PropertyDescriptor already sets the id-plus-name shape for exactly this.
      name:       {type: string, presence: required}
      value:      {type: any, presence: nullable}
      # bool, int, float and string are the four the reference can edit: it
      # branches on the Python type of the CURRENT value and opens a toggle, an
      # askinteger, or an askstring (generic_attributes_treeview.py:89-105), and
      # falls through with no editor for anything else. string_list is tags and
      # related_signal_ids, and it is exactly that fall-through case: the
      # reference marks Tags unlocked but its double-click handler has no list
      # branch, so new_value stays None and the write never happens
      # (lines 107-110). It carries an array of strings here; the reference's
      # own display joins them with os.linesep, which is a rendering choice, not
      # a wire shape.
      value_type: {type: enum, values: [bool, int, float, string, string_list], presence: required}
      # true means this attribute cannot be written. Its sources are the
      # reference's own two: the per-attribute Locked flag it hardcodes for
      # global_id, local_id, streamed, last_value, signal_id, requires_signal
      # and the domain/related signal ids, and IComponent.locked_attributes,
      # which openDAQ fills at runtime and the reference folds in at lines
      # 168-178, marking every named attribute locked.
      #
      # WHAT read_only MUST NOT BE USED FOR. It is openDAQ's answer about the
      # component, never the host's answer about itself. A host that has not
      # implemented attribute writing declares no attribute.write capability and
      # the client disables the editors from the gap; it must not instead report
      # read_only true on every row, because that says openDAQ locked the
      # attribute, which is a cause the host has not established.
      #
      # It is named read_only, not locked, deliberately. `locked` is already
      # taken on Node for the DEVICE LOCK, a different mechanism with its own
      # capability and its own two operations, and read_only is already this
      # contract's word for "this field cannot be written" on
      # PropertyDescriptor.read_only. Reusing `locked` here would put one word
      # on two unrelated mechanisms in one wire vocabulary.
      read_only:  {type: bool, presence: required}

  SignalDescriptor:
    kind: record
    fields:
      id:          {type: string, presence: required}
      name:        {type: string, presence: required}
      sample_type: {type: enum, values: [float32, float64, int32, int64], presence: required}
      unit:        {type: string, presence: nullable}
      domain_id:   {type: string, presence: nullable, references: Node.id}

  Gap:
    kind: record
    fields:
      capability: {type: string, presence: required, references: capabilities.id}
      kind:       {type: enum, values: [binding, host], presence: required}
      reason:     {type: string, presence: required, min_length: 1}

  # One component type a module offers. The reference reads these four
  # dictionaries off a module - available_device_types,
  # available_function_block_types, available_server_types and
  # available_streaming_types - and casts each value to IComponentType for id,
  # name and description; connection_string_prefix exists only on IDeviceType
  # and IStreamingType, which is why it is nullable.
  #
  # Declared before ModuleInfo because ModuleInfo holds an array of these and
  # the C++ target emits records in this order.
  ComponentTypeInfo:
    kind: record
    fields:
      id:                       {type: string, presence: required}
      name:                     {type: string, presence: required}
      kind:                     {type: enum, values: [device, function_block, server, streaming], presence: required}
      description:              {type: string, presence: nullable}
      connection_string_prefix: {type: string, presence: nullable}

  # One loaded module, as IModuleInfo reports it. version is the
  # major.minor.patch string the module's version info renders, and is null
  # where a module carries no version info - the reference prints "N/A" there.
  ModuleInfo:
    kind: record
    fields:
      id:              {type: string, presence: required}
      name:            {type: string, presence: required}
      version:         {type: string, presence: nullable}
      component_types: {type: array, items: ComponentTypeInfo, presence: required}

# EvalValue strings cross the wire as source text for display. No client, in
# any target, may evaluate them.
eval_value_strings:
  fields: [PropertyDescriptor.validator, PropertyDescriptor.coercer]
  crosses_wire_as: source_string
  interpret_client_side: false

# ---------------------------------------------------------------------------
# 4. Capabilities
# ---------------------------------------------------------------------------
#
# This list is the baseline. A host declares the capabilities it implements;
# the gap list is GENERATED as baseline minus host capabilities. A host never
# writes a gap list of its own, only the reason per gap.

capabilities:
  - {id: device.scan,         operations: [[scan, available, devices]]}
  - {id: device.connect,      operations: [[connect, device], [disconnect, device]]}
  - {id: tree.read,           operations: [[get, component, tree]]}
  - {id: property.read,       operations: [[get, property, value], [get, property, descriptors]]}
  - {id: property.write,      operations: [[set, property, value]]}
  - {id: function_block.add,  operations: [[list, function, block, types], [add, function, block], [remove, function, block]]}
  - {id: streaming.decimated, operations: [[subscribe, signal], [unsubscribe, signal]]}
  - {id: streaming.raw,       operations: [[read, samples, raw]]}
  # A capability is what one UI control is enabled or disabled on, so these
  # three are exactly the three controls they gate: the device row's operation
  # mode menu, the device row's lock/unlock pair, and the Modules view. The
  # per-row component state that arrived with them - active, locked,
  # component_status, connection_status, operation_mode - adds NO capability:
  # it rides on Node, which tree.read already carries, so a host that can read a
  # tree can draw the state suffix without declaring anything new.
  - {id: device.mode,         operations: [[get, device, operation, modes], [set, device, operation, mode]]}
  - {id: device.lock,         operations: [[lock, device], [unlock, device]]}
  - {id: module.read,         operations: [[list, loaded, modules]]}
  # module.load is separate from module.read, and deliberately so. Reading the
  # loaded module list is an enumeration; load_module_from_host_path makes the
  # host process dlopen a file off its own disk and run that file's
  # initialisation, which is arbitrary code execution inside the host. Those are
  # not the same permission in any sense, and a capability is exactly what one
  # UI control is enabled or disabled on - here the Modules view's grid, versus
  # the "load a module" action on it.
  #
  # Capability semantics are ALL-OF, so folding the two into module.read would
  # mean a host that wants to show its module list has no way to withhold the
  # loader: declaring module.read would declare the loader too. The mock host
  # and any sandboxed deployment need precisely that split. The contract already
  # takes this position once, in getter_setter_pairing.pairs: get_property_value
  # and set_property_value span property.read and property.write "because
  # reading and writing are separately grantable". Enumerating modules and
  # loading one is the same split, with a much larger blast radius on the write
  # side.
  - {id: module.load,         operations: [[load, module, from, host, path]]}

  # --- the eight capabilities the last reference panels need -----------------
  #
  # Every one of these is named for the ONE UI control it enables or disables,
  # because that is what a capability is for. Where a pair could have been one
  # id, the split is argued on the spot and the argument is always the same
  # shape as the two splits this contract already made: property.read against
  # property.write "because reading and writing are separately grantable", and
  # module.read against module.load because enumerating and executing are not
  # one permission.

  # The attributes panel, and the editors inside it. Split for the reason
  # property.read and property.write are split, and for one more that the
  # rulings force: under a single id, a host that can read attributes but not
  # write them would have to report read_only true on every row to disable the
  # editors, and read_only is openDAQ's statement that the component locked the
  # attribute. Saying that when the truth is "this host has no writer" asserts a
  # cause nobody established. Two ids let such a host declare attribute.read
  # alone and let the client disable the editors from the GAP, which is the
  # honest surface and says "currently not available".
  - {id: attribute.read,      operations: [[get, component, attributes]]}
  - {id: attribute.write,     operations: [[set, component, attribute]]}

  # The add-server card grid: list_server_types draws it and add_server is the
  # commit on a card, which is one control, exactly as function_block.add covers
  # its list and its add together. remove_server joins them for the same reason
  # remove_function_block sits under function_block.add: the removal is the
  # undo of the addition, on the thing this capability created, and there is no
  # deployment that wants a client to add servers but never take one away.
  - {id: server.add,          operations: [[list, server, types], [add, server], [remove, server]]}
  # The server row's discovery items, which are a different control on a
  # different surface at a different time: they act on a server row that this
  # session may not have created and may not be permitted to create. Folding
  # them into server.add would mean a host that publishes servers from its own
  # configuration, and can perfectly well call enableDiscovery on them, must
  # hide those items unless it also lets a client create servers - ALL-OF makes
  # that unavoidable. The mock host and any locked-down deployment are exactly
  # that shape.
  - {id: server.discovery,    operations: [[set, server, discovery, enabled]]}

  # The recorder card's one Start/Stop toggle. Two operations, one control, one
  # capability: there is no deployment that wants to start a recording but not
  # stop one.
  - {id: recorder.control,    operations: [[start, recording], [stop, recording]]}

  # The row menu's Begin update / End update pair. NOT folded into
  # property.write, and the direction of that mistake matters: capability
  # semantics are ALL-OF, so folding would mean a host whose binding cannot
  # reach beginUpdate has to withhold property.write, and withholding
  # property.write disables every property editor in the application. A host
  # that can write properties one at a time but cannot batch them loses the
  # batch control only.
  - {id: property.batched_update, operations: [[begin, batched, property, update], [end, batched, property, update]]}

  # The File menu's two configuration entries. Split on the module.read /
  # module.load argument, which applies here with a larger blast radius than it
  # had there: saving serialises the instance and reads nothing else, while
  # loading REPLACES the configuration of every device under the instance in one
  # call. Under one id a host could not offer the export without also offering
  # the overwrite.
  - {id: configuration.save,  operations: [[save, instance, configuration, to, string]]}
  - {id: configuration.load,  operations: [[load, instance, configuration, from, string]]}

gap_generation:
  computed_as: baseline_capabilities_minus_host_capabilities
  declared_by_host: reason_only
  host_may_declare_gap_list: false
  kinds:
    binding: the SDK binding for this host language lacks the feature
    host: the handler has not been written yet

# ---------------------------------------------------------------------------
# 5. Operations
# ---------------------------------------------------------------------------
#
# The closed operation table. An operation absent from this table MUST NOT
# exist as a public host method; lints.no_undeclared_public_method enforces it.
# Host coverage of this table is 100%, enforced by a build failure on a missing
# handler.

operations:

  - tokens: [scan, available, devices]
    kind: action
    capability: device.scan
    params: []
    returns: {type: array, items: DeviceInfo}
    errors: [internal]
    naming_overrides: {}

  - tokens: [connect, device]
    kind: action
    capability: device.connect
    params:
      - {name: connection_string, type: string, presence: required}
    returns: {type: Node}
    errors: [not_found, invalid_value, timeout]
    naming_overrides: {}

  - tokens: [disconnect, device]
    kind: action
    capability: device.connect
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    errors: [not_found]
    naming_overrides: {}

  - tokens: [get, component, tree]
    kind: getter
    capability: tree.read
    params:
      - {name: root_id, type: string, presence: optional, references: Node.id}
    returns: {type: array, items: Node}
    # not_found covers a root_id naming a node that is not in the tree. It was
    # added because all four hosts - cpp, python, csharp and rust, written
    # independently - answered not_found to root_id
    # "/quackoscope-cross-host-report/no-such-node", and the cross-host
    # conformance report marked every one of them "+", meaning inside the closed
    # set but outside this operation's declared subset. Four independent
    # implementations agreeing is evidence about the contract, not the hosts.
    errors: [not_connected, not_found]
    naming_overrides: {}

  - tokens: [get, property, value]
    kind: getter
    capability: property.read
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      - {name: property_id, type: string, presence: required, references: PropertyDescriptor.id}
    returns: {type: any}
    errors: [not_found, not_connected]
    naming_overrides: {}

  - tokens: [get, property, descriptors]
    kind: getter
    capability: property.read
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: array, items: PropertyDescriptor}
    errors: [not_found, not_connected]
    naming_overrides: {}

  - tokens: [set, property, value]
    kind: setter
    capability: property.write
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      - {name: property_id, type: string, presence: required, references: PropertyDescriptor.id}
      - {name: value, type: any, presence: required}
    returns: {type: void}
    # read_only is openDAQ refusing THIS property's write -
    # PropertyDescriptor.read_only, i.e. the property object's own refusal.
    #
    # A LOCKED ANCESTOR DEVICE IS NOT A read_only CAUSE HERE, and a host must
    # not manufacture one. The device lock is enforced only in the
    # config-protocol server, by ConfigServerAccessControl::protectLockedComponent
    # (config_server_access_control.h:75-81), which
    # config_server_component.h:78 calls on setPropertyValue. Core does not:
    # GenericPropertyObjectImpl::setPropertyValue consults no lock, so an
    # in-process write to a property under a locked device SUCCEEDS. Every host
    # in this repository holds an in-process Instance, so every one of them is
    # on that path. A host that refused such a write would be layering a rule
    # openDAQ does not have, and the snippet the quack shows would then be
    # openDAQ calls that do not produce what the user just saw.
    errors: [not_found, read_only, invalid_value]
    naming_overrides: {}

  - tokens: [list, function, block, types]
    kind: getter
    capability: function_block.add
    params: []
    returns: {type: array, items: string}
    errors: [not_connected]
    naming_overrides: {}

  - tokens: [add, function, block]
    kind: action
    capability: function_block.add
    params:
      - {name: parent_id, type: string, presence: required, references: Node.id}
      - {name: type_id, type: string, presence: required}
    returns: {type: Node}
    errors: [not_found, unsupported]
    naming_overrides: {}

  - tokens: [remove, function, block]
    kind: action
    capability: function_block.add
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    errors: [not_found]
    naming_overrides: {}

  - tokens: [subscribe, signal]
    kind: action
    capability: streaming.decimated
    params:
      - {name: signal_id, type: string, presence: required, references: Node.id}
      - {name: pixel_columns, type: int, presence: required}
    returns: {type: string, semantic: subscription_id}
    # invalid_value is pixel_columns outside what a plot surface can be
    # decimated to - 0, or a hundred million.
    #
    # pixel_columns IS THIS CONTRACT'S PARAMETER, NOT openDAQ'S, so openDAQ
    # raises nothing for it and cannot: grep -rn "pixel" over core/, modules/
    # and the reference GUI returns exactly one hit, gui_demo/utils.py:162, a
    # comment about icon scaling. openDAQ's readers take a sample count, never a
    # display-column count. The validation is therefore the host's own, of the
    # host's own parameter, and it is correct - which is why all five hosts,
    # including the mock that has no SDK at all, independently answered
    # invalid_value to it. A code every host derives from the contract alone
    # belongs in the contract.
    #
    # This is the same self-contradiction unsubscribe_signal below already
    # fixed, for the same reason and by the same edit.
    errors: [not_found, not_connected, invalid_value]
    naming_overrides: {}

  - tokens: [unsubscribe, signal]
    kind: action
    capability: streaming.decimated
    params:
      - {name: subscription_id, type: string, presence: required}
    returns: {type: void}
    # invalid_value is required of this operation by subscription_id_encoding
    # below, whose on_unparseable field is invalid_value; unsubscribe_signal is
    # the only operation taking a subscription_id, so it is the only place that
    # rule can fire. Leaving invalid_value out of this subset made the contract
    # contradict itself: all four hosts answered invalid_value to
    # subscription_id "not-a-subscription-id" - obeying on_unparseable - and the
    # cross-host report marked all four "+" against this list.
    errors: [not_found, invalid_value]
    naming_overrides: {}

  - tokens: [read, samples, raw]
    kind: action
    capability: streaming.raw
    params:
      - {name: signal_id, type: string, presence: required, references: Node.id}
      - {name: count, type: int, presence: required}
    returns: {type: binary_frame}
    errors: [not_found, not_connected]
    naming_overrides: {}

  # --- device operation mode -------------------------------------------------
  #
  # The CURRENT mode is Node.operation_mode, because the reference draws it into
  # every device row's name and a per-row fact must not cost a per-row call.
  # This operation is the AVAILABLE list, which nothing draws until the mode
  # menu is opened on one device, so it is fetched then.

  - tokens: [get, device, operation, modes]
    kind: getter
    capability: device.mode
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    # Every element is one of the values of Node.operation_mode, which is the
    # single place OperationModeType is enumerated. The array is items: string
    # rather than an enum because contract types render an enum only as a
    # record field, so an array of enum has no rendering in any target.
    returns: {type: array, items: string, semantic: operation_mode_names}
    # unsupported is node_id naming a component that is not a device: the node
    # exists, so not_found would be a lie, and it has no operation modes.
    errors: [not_found, not_connected, unsupported]
    naming_overrides: {}

  - tokens: [set, device, operation, mode]
    kind: setter
    capability: device.mode
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      # One of the values of Node.operation_mode, and one of the elements
      # get_device_operation_modes returned for this node.
      - {name: mode, type: string, presence: required}
    returns: {type: void}
    # invalid_value: a mode name outside Node.operation_mode's values, or one
    # the device did not list as available. unsupported: node_id is not a
    # device.
    #
    # THERE IS NO read_only ON THIS ROW, and its removal is the correction of a
    # rule this contract invented. It used to read "read_only: the device is
    # locked", and openDAQ does not do that:
    # GenericDevice::setOperationMode (device_impl.h:1257-1281) consults no lock
    # at all - it checks onGetAvailableOperationModes, takes the tree lock guard
    # and writes. The device lock refuses writes only in the config-protocol
    # server (config_server_access_control.h:75-81), and these hosts are
    # in-process, so no lock refusal can reach this row. Every SDK host was
    # marked BROKE against the old wording for doing exactly what openDAQ does.
    errors: [not_found, invalid_value, unsupported]
    naming_overrides: {}

  # --- device lock -----------------------------------------------------------
  #
  # The lock STATE is Node.locked, effective and inheritance-applied, so the
  # tree's lock icon and the greying of a locked subtree need no call. These two
  # rows are the actions behind the lock and unlock icons the tree already ships.
  #
  # THE LOCK IS OWNED BY A USER, AND THERE IS NO SESSION IN IT. This contract
  # used to say "already locked, and not by this session", which is a rule
  # openDAQ does not have and no host could honestly produce. openDAQ's own
  # header, device.h:313-317, is the whole story and is quoted here so the next
  # reader does not have to take this comment's word for it:
  #
  #     "Lock a device with a session user. Once locked, no properties of the
  #      device can be changed via the protocol layer. Only the same user who
  #      locked the device can unlock it. If no user was specified when the
  #      device was locked, any user will be able to unlock it."
  #
  # IDevice::lock() (device.h:318), unlock() (:324) and isLocked(Bool*) (:330)
  # all take NO ARGUMENT; device_impl.h:1040-1048 implements the public forms as
  # literally `return this->lock(nullptr);` and `return this->unlock(nullptr);`.
  # The user-taking forms are on IDevicePrivate (device_private.h:39-42), and
  # over the wire the user comes from the CONNECTION, not the caller:
  # config_server_device.h:78 calls lock(context.user), and
  # config_client_device_impl.h:302-304 logs that "The specified user was
  # ignored when unlocking a remote device. A session user was used instead."
  #
  # AND WITH NO AUTHENTICATION CONFIGURED, WHICH IS THIS APPLICATION'S
  # CONFIGURATION, THE LOCK IS HELD BY NOBODY. AuthenticationProvider() defaults
  # to allowAnonymous = true (authentication_provider_factory.h:31-35) and hands
  # every anonymous connection the one User("", "") object
  # (authentication_provider_impl.cpp:23 and :56); isAnonymous is
  # username == "" && passwordHash == "" (user_impl.cpp:42-48); and
  # UserLockImpl::lock (user_lock_impl.cpp:15-27) turns an anonymous user into
  # nullptr before storing it. openDAQ's own test states the consequence
  # plainly - test_device.cpp:399-430, LockUnlockAnonymous, locks anonymously
  # and then asserts that unlock(jure) and unlock(tomaz), two DIFFERENT users,
  # each succeed. A second connection taking or releasing a held lock is
  # therefore openDAQ's behaviour, not a host defect.

  - tokens: [lock, device]
    kind: action
    capability: device.lock
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    # read_only is OPENDAQ_ERR_DEVICE_LOCKED (errors.h:128, surfacing as
    # DeviceLockedException), which UserLockImpl::lock returns in exactly one
    # case: `userLock.has_value() && userLock != userPtr`
    # (user_lock_impl.cpp:21-22), i.e. a DIFFERENT NAMED user already holds it.
    # device_impl.h:1707-1730 returns the same code for a nested device whose
    # ancestor is locked. Both are reachable only where authentication names
    # users, so with this application's configuration a host will not produce
    # this code and MUST NOT SYNTHESISE IT: a second lock of an
    # anonymously-locked device compares nullptr against nullptr and succeeds.
    # unsupported is node_id naming a component that is not a device.
    errors: [not_found, read_only, unsupported]
    naming_overrides: {}

  - tokens: [unlock, device]
    kind: action
    capability: device.lock
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      # IDevice.unlock() takes no arguments and refuses when another NAMED user
      # holds the lock; the reference then offers a forced unlock, which is
      # IDevicePrivate.force_unlock() - a different interface, reached by a cast.
      # It is an optional parameter rather than a row of its own because the
      # forced path is the same act on the same node with the same capability,
      # and because adding a parameter to a row that no host has implemented yet
      # is free, while editing a row later is the heavier change this contract
      # keeps warning about.
      - {name: force, type: bool, presence: optional}
    returns: {type: void}
    # read_only is the refusal the reference reacts to by offering the forced
    # unlock, so it is the exact signal that enables that control. It is a
    # DIFFERENT openDAQ code from lock_device's: UserLockImpl::unlock
    # (user_lock_impl.cpp:29-36) returns OPENDAQ_ERR_ACCESSDENIED (errors.h:78,
    # AccessDeniedException), and only when
    # `userLock.has_value() && userLock != nullptr && userLock != user` - the
    # `!= nullptr` term is why an anonymously-taken lock, which is the only kind
    # this application can take, is cleared by ANY caller. So this code is
    # unreachable here too, and a host must not invent it to keep a second
    # session out. unsupported covers both "not a device" and force: true on a
    # host that cannot reach IDevicePrivate.
    #
    # THE FORCED PATH IS REACTIVE, NOT A STATE CHECK, and that is how the
    # reference offers it: handle_unlock (gui_demo.py:1394-1407) calls
    # device.unlock() and only inside `except` asks "Unlock failed ... Do you
    # want to forcefully unlock the device?", then calls
    # IDevicePrivate.force_unlock() (:1409-1416). The Lock and Unlock menu items
    # themselves are unconditional (:1026-1028) - neither is enabled or disabled
    # by lock state, and the GUI never asks whose lock it is. In-process, where
    # no exception is possible, that dialog is unreachable. forceUnlock is an
    # unconditional userLock.reset() (user_lock_impl.cpp:38-42) - "A force
    # unlock will always succeed, regardless of which user initially locked the
    # object" (user_lock.h:55-58) - and it carries no ownership check on the
    # wire either (config_server_device.h:93-101 gates it on Read|Write only).
    errors: [not_found, read_only, unsupported]
    naming_overrides: {}

  # --- modules ---------------------------------------------------------------

  - tokens: [list, loaded, modules]
    kind: getter
    capability: module.read
    params: []
    # One call answers the whole Modules view: the reference reads
    # instance.module_manager.modules in-process and then reads four type
    # dictionaries off each module, which over a socket would be 1 + 4N calls if
    # the types were fetched per module. The component types ride inside
    # ModuleInfo so a module card can show what the module offers without a
    # second request.
    returns: {type: array, items: ModuleInfo}
    errors: [not_connected, internal]
    naming_overrides: {}

  # --- loading a module ------------------------------------------------------
  #
  # THE PATH IS ON THE HOST'S FILESYSTEM. That is the whole design decision of
  # this row, it is in the row's own name so no caller can miss it, and it is in
  # the parameter's name so no signature can hide it. The reference cannot
  # settle this question, because the reference is in-process: gui_demo.py:754-777
  # opens a file dialog and hands the chosen path straight to
  # instance.module_manager.load_module(file_path), and the machine that picked
  # the path is the machine that loads it. Quackoscope splits those two machines
  # across a socket. A path a browser picks is a path on the CLIENT's disk,
  # which the host may not have.
  #
  # The two honest designs were: (a) the row takes a host-side path; (b) the
  # module bytes are uploaded over the wire. (a) is chosen, on three grounds
  # taken from this contract and from openDAQ's own API:
  #
  # 1. openDAQ HAS NO BYTES-IN API TO CARRY (b). module_manager.h:58-65 declares
  #    loadModule(IString* path, IModule** module) as "Loads and adds a single
  #    module from the given absolute file system path", and the only in-memory
  #    sibling, addModule(IModule*), takes an already-constructed module object,
  #    not a buffer. There is no overload anywhere on IModuleManager that
  #    accepts module bytes. So (b) would not be a heavier binding of the same
  #    SDK call; it would be an operation openDAQ does not offer, and every host
  #    would have to write the bytes to a temporary file and call loadModule on
  #    the path anyway - which is (a) with a hidden upload bolted in front.
  #
  # 2. THIS CONTRACT HAS NO CLIENT-TO-SERVER BINARY PLANE for (b) to travel on.
  #    envelopes.request has exactly three fields - id, method and a JSON params
  #    object - and section 9's binary_frame is a sample frame, defined
  #    server-to-client, whose 17-byte header carries subscription_id,
  #    domain_start, sample_count and encoding and NO correlation id. Uploading
  #    would need a second binary frame type and a correlation id the header
  #    does not have. That missing correlation id is the exact unresolved issue
  #    that has kept read_samples_raw a gap on every host. One open wound of
  #    that shape is enough; this row does not open a second.
  #
  # 3. THE DECLARED FRAME LIMIT FORBIDS (b) AS JSON. The remaining way to move
  #    bytes without a new plane is base64 inside params, at roughly 1.37x the
  #    binary. handshake.limits.max_frame_bytes defaults to 262144, and an
  #    openDAQ module .dll is megabytes. (b) cannot be done without also
  #    renegotiating that limit by an order of magnitude.
  #
  # WHAT THIS OBLIGES THE UI TO DO, and it is not optional: the control is a
  # path field, never a local file picker. A browser file input yields a client
  # path, and shipping one here would be a control that looks local and silently
  # means remote - exactly what the ruling forbids. The field states that the
  # path is read on the host. The host-side module directory is already a known
  # value on both sides - it is the manifest's module_path, the directory
  # loadModules() swept at startup - so it is the sensible thing to show beside
  # the field as the place the host already looks.
  #
  # openDAQ's own doc comment pins two of the four error codes: "The specified
  # path must exist" is not_found, and "reference a file with the proper
  # extension" is invalid_value. The extension is platform-dependent -
  # .module.dll on Windows, .dylib on Darwin, .module.so elsewhere, per
  # gui_demo.py:755-760 - and it is the HOST's platform that decides which,
  # because the host is the machine doing the loading. A client must not filter
  # the field by its own platform's extension.
  - tokens: [load, module, from, host, path]
    kind: action
    capability: module.load
    params:
      # Absolute, and resolved on the host's filesystem. Named host_path rather
      # than path so that a generated signature carries the decision on its own,
      # without the reader having to come back to this comment.
      - {name: host_path, type: string, presence: required}
    # loadModule's out-parameter is the module it loaded, so the newly loaded
    # module comes back as the record the Modules grid already draws. That saves
    # the caller a re-list, and it follows the shape connect_device and
    # add_function_block already set in this table: an action that brings
    # something into existence returns the record of the thing it created.
    returns: {type: ModuleInfo}
    # not_found: nothing at host_path on the HOST's disk. Under design (a) this
    #   is the most likely answer a user will ever see from this row - it is
    #   what a path copied off the client's own machine produces - so the UI
    #   must render it as "the host has no file there", not as a missing node.
    # not_connected: no instance, so no module manager to load into. Same
    #   condition list_loaded_modules answers not_connected to.
    # invalid_value: the file is there but is not a loadable openDAQ module -
    #   wrong extension for the host's platform, not a shared library, wrong
    #   ABI, no module entry point. It also covers loading a module that is
    #   already loaded: loadModule "loads and adds", and addModule answers
    #   OPENDAQ_ERR_DUPLICATEITEM on an identical module, which is a refusal of
    #   this host_path rather than an internal fault.
    # internal: the module loaded and its own initialisation threw.
    # Not read_only, which is this set's word for a refused write to a protected
    # component, and there is no component here. Not timeout: loadModule is a
    # local dlopen on the host, not a network round trip. Not unsupported: a
    # host that cannot load modules does not declare module.load at all, and
    # that is a capability gap, not a per-call error.
    errors: [not_found, not_connected, invalid_value, internal]
    naming_overrides: {}

  # --- component attributes --------------------------------------------------
  #
  # The reference's ATTRIBUTES treeview, which is a separate surface from its
  # properties treeview and reads a separate thing. ComponentAttribute in
  # section 3 carries the whole argument for why attributes are a record and two
  # rows rather than fields on Node; these two rows are the panel's read and the
  # panel's write.

  - tokens: [get, component, attributes]
    kind: getter
    capability: attribute.read
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    # The rows for THIS component, in the order the host reached them. The set
    # is not fixed: the reference starts from seven IComponent attributes and
    # then adds five more if ISignal casts, or three more if IInputPort casts
    # (generic_attributes_treeview.py:126-166). A host that cannot perform a
    # cast returns fewer rows; it does not return a row with a null value, which
    # would claim the attribute exists and has no value.
    returns: {type: array, items: ComponentAttribute}
    # not_found and not_connected for the same two reasons
    # get_property_descriptors declares them: node_id may name nothing, and
    # there may be no instance to read. invalid_value is error_policy's
    # malformed_parameter_becomes - node_id arriving as 17 rather than as a
    # string. The lookup this row performs is
    # IComponent::findComponent(IString* id, ...) and an integer is not an
    # IString*, so openDAQ is never reached and not_found would assert a lookup
    # that never happened.
    errors: [not_found, not_connected, invalid_value]
    naming_overrides: {}

  - tokens: [set, component, attribute]
    kind: setter
    capability: attribute.write
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      # One of the ComponentAttribute.id values get_component_attributes
      # returned for this node.
      - {name: attribute_id, type: string, presence: required, references: ComponentAttribute.id}
      - {name: value, type: any, presence: required}
    returns: {type: void}
    # Deliberately the same three codes set_property_value declares, because the
    # three failures are the same three. not_found: node_id names no component,
    # or attribute_id is not one this component reports. read_only: the
    # attribute's ComponentAttribute.read_only is true, i.e. openDAQ's
    # locked_attributes or the reference's own hardcoded Locked flag refused the
    # write - never "this host has no writer", which is a capability gap.
    # invalid_value: the value is of the wrong type for the attribute, or
    # openDAQ rejected it.
    #
    # A GENUINELY LOCKED ATTRIBUTE RAISES NOTHING, so this row must not be read
    # as promising that it does. COMPONENT_AVAILABLE_ATTRIBUTES is the entire
    # universe of the locked-attribute machinery - {"Name", "Description",
    # "Visible", "Active"} at component_impl.h:59, plus {"Public",
    # "DomainSignal", "RelatedSignals"} (signal_impl.h:53) and {"Public"}
    # (input_port_impl.h:47) - and when one of those is locked the setter
    # returns OPENDAQ_IGNORED (component_impl.h:541-552 for setName, :592-603
    # setDescription, :365-376 setActive, :650-661 setVisible). OPENDAQ_IGNORED
    # is 0x00000006u (errors.h:38) and OPENDAQ_FAILED is (x) & 0x80000000u
    # (errors.h:28), so it is a SUCCESS: openDAQ silently does nothing and no
    # binding raises. A host that meets this must read the attribute back and
    # report the unchanged value; it must NOT manufacture read_only from the
    # absence of an exception.
    #
    # tags IS NOT IN THAT MACHINERY AT ALL, so ComponentAttribute.read_only can
    # never be true for it on the reference device, and a host reporting
    # otherwise is reporting itself. IComponent has getTags and no setTags
    # (component.h:164); ITags is read-only, getList/contains/query
    # (tags.h:39-60); the writer is ITagsPrivate::add/remove/replace
    # (tags_private.h:34-56), reached by a cast from component.tags, and it is
    # present in every binding - py_tags_private.cpp:43-69, C# TagsPrivate.cs
    # :73/:96/:115, C daqTagsPrivate_* (c/.../tags_private.h:44-46), Rust
    # TagsPrivate in opendaq-0.1.1 src/generated/component.rs:2835+. tags_impl.h
    # :88-150 performs no lock check, so tags.h:36-37's "can only be modified if
    # the object is not locked" is documentation of an unimplemented intent.
    errors: [not_found, read_only, invalid_value]
    naming_overrides: {}

  # --- servers, and their discovery ------------------------------------------

  - tokens: [list, server, types]
    kind: getter
    capability: server.add
    params: []
    # ComponentTypeInfo, not a bare id list, and this is where this contract
    # stops matching list_function_block_types. The reference's add-server
    # window is a three-column table - Name, Description, Id
    # (add_server_dialog.py:35-37) - filled by casting each value of
    # instance.available_server_types to IServerType and reading name and
    # description off it. A card grid needs the same three. ComponentTypeInfo
    # already carries exactly id, name, kind and description, so this reuses it
    # rather than inventing a ServerTypeInfo that would differ from it in
    # nothing. kind is `server` on every element of this response, which is one
    # redundant field per row and the price of not adding a fifth record.
    #
    # It is NOT satisfied by list_loaded_modules, which also reports server
    # types. Those are the types each MODULE offers; this is what the instance
    # will actually accept, and the two are only accidentally equal. Reading it
    # off list_loaded_modules would also gate the add-server grid on module.read
    # - the Modules view's capability - which is a different control.
    returns: {type: array, items: ComponentTypeInfo}
    # Same as list_function_block_types: the only way to have no server types is
    # to have no instance.
    errors: [not_connected]
    naming_overrides: {}

  # THERE IS NO parent_id ON THIS ROW, and that is a finding about the reference
  # rather than an omission. AddServerDialog is handed the selected component
  # and stores it as self.parent_component, and then never uses it:
  # execute_add_server calls self.context.instance.add_server(server_type_id,
  # config) on the INSTANCE, always (add_server_dialog.py:211). gui_demo.py's
  # menu_add_items says why in its own words - "only the root device accepts
  # servers, IDevice::onAddServer refuses the rest" - and offers the Add server
  # item only when node.global_id == instance.global_id. A parent_id parameter
  # would be a parameter with exactly one legal value, and a host would have to
  # answer an error for every other, so the row does not take one.
  - tokens: [add, server]
    kind: action
    capability: server.add
    params:
      # One of the ComponentTypeInfo.id values list_server_types returned.
      - {name: type_id, type: string, presence: required, references: ComponentTypeInfo.id}
    # The record of the thing it created, which is the shape connect_device,
    # add_function_block and load_module_from_host_path already set. Its kind is
    # `server`, which is the value NodeKind grew for this row.
    returns: {type: Node}
    # unsupported: type_id is not among list_server_types, which is exactly what
    #   add_function_block answers to an unknown type id.
    # not_connected: no instance, so nothing to add a server to.
    # invalid_value: the type exists and the instance refused this addition. The
    #   reference has this path and only prints it - 'Error adding server',
    #   f'{server_type_id}: {str(e)}' (add_server_dialog.py:215) - so the native
    #   text belongs in error.detail, which is where opaque native text goes.
    # internal: adding a server opens a listening socket in the host process,
    #   and that fails for reasons that are not about type_id at all - a port
    #   already bound, a permission refused by the operating system.
    # Not read_only: that is this set's word for a refused write to a protected
    # component, and there is no component being written here.
    errors: [not_connected, unsupported, invalid_value, internal]
    naming_overrides: {}

  # ADDING A SERVER IS NOT ONE-WAY, and this row exists because saying it was
  # would have been false teaching. openDAQ takes a server down with
  # IDevice::removeServer(IServer* server) - device.h:300-304, "Removes the
  # server provided as argument" - which device_impl.h:1014-1026 wraps to
  # onRemoveServer (:1479-1487), the exact mirror of onAddServer (:1465-1476),
  # same root-device restriction and then `this->servers.removeItem(server)`.
  # IInstance forwards it: instance_impl.cpp:271-274 is
  # `return rootDevice->removeServer(server);`.
  #
  # THE SOCKET ACTUALLY CLOSES, which is what makes this a real undo rather than
  # a delisting. folder_impl.h:598-605 removes the item, which calls
  # IComponent::removed, and ServerImpl::removed (server_impl.h:199-202) is
  # `checkErrorInfo(stop()); Super::removed();` - IServer::stop, whose own doc
  # (server.h:55) is "Stops the server. This is called when we remove the server
  # from the Instance or Instance is closing."
  #
  # Every binding has it: python remove_server (py_device.cpp:310-315), C#
  # Device.cs:1030 `public void RemoveServer(Server server)`, C
  # daqDevice_removeServer (c/.../device.h:80), rust
  # `pub fn remove_server(&self, server: &Server)` (opendaq-0.1.1
  # src/generated/device.rs:3414-3418).
  #
  # TWO HONEST CAVEATS, stated because a host will meet both. (1) The native
  # config protocol has NO RemoveServer RPC: config_protocol_server.cpp:161-179
  # registers Lock, Unlock, ForceUnlock, AddDevice, RemoveDevice and no removal
  # of a server, so a host proxying a REMOTE instance would declare a gap here.
  # Every host in this repository holds an in-process Instance, so this does not
  # limit them. (2) The reference GUI never removes one - menu_server_groups
  # (gui_demo.py:1032-1039) offers only the discovery items, the update items
  # and the property items, unlike menu_device_groups and
  # menu_function_block_groups which both carry a removal. So this row is argued
  # from openDAQ's API, not from the reference's menu.
  #
  # It takes node_id, the SERVER node - the same shape remove_function_block
  # takes - because what crosses the wire is an id and the host resolves it to
  # the IServer the call needs.
  - tokens: [remove, server]
    kind: action
    capability: server.add
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    # not_found: node_id names no component.
    # unsupported: the component exists and is not a server, and also the target
    #   not being the root device - onRemoveServer throws NotFoundException
    #   "Device does not allow adding/removing servers." for any non-root device
    #   (device_impl.h:1484). It is unsupported rather than not_found
    #   because the node was found; what is missing is the ability, which is the
    #   use get_device_operation_modes and set_server_discovery_enabled already
    #   make of this code.
    # internal: stop() threw while closing the listening socket, which is native
    #   text for error.detail.
    # Not read_only: no component is being written. Not invalid_value: there is
    # no value on this row beyond node_id.
    errors: [not_found, unsupported, internal]
    naming_overrides: {}

  # ONE ROW WITH A BOOLEAN, NOT TWO ROWS. The reference draws two menu items,
  # Enable discovery and Disable discovery (gui_demo.py:1034-1038), and openDAQ
  # has two methods, IServer::enableDiscovery and IServer::disableDiscovery
  # (server.h:66 and server.h:90). They are one setter over one boolean, so the
  # contract carries one setter and the row menu still draws two items, each
  # sending this method with a different `enabled`.
  #
  # THERE IS NO GETTER AND THERE CANNOT BE ONE. Enumerated: the Python binding's
  # IServer surface in the generated opendaq.pyi is exactly can_cast_from,
  # cast_from, convert_from, from_raw_interface, disable_discovery,
  # enable_discovery, get_signals, id, signals, stop, streaming - eleven
  # members, none of which reports whether discovery is on. openDAQ's own
  # server.h declares stop, getId, enableDiscovery, getSignals, getStreaming and
  # disableDiscovery, and no discovery-state getter either. So this state cannot
  # be a Node field the way `active` and `locked` are: no host can fill it.
  #
  # WHAT THAT OBLIGES THE UI TO DO. The control is two actions, not a switch. A
  # switch has a position, the position claims to be the device's state, and
  # there is no state to read - the handle would be showing what this session
  # last sent, which the ruling on the property slider already forbids ("the
  # handle follows the device's read-back"). Two named items that each send one
  # value tell the truth.
  - tokens: [set, server, discovery, enabled]
    kind: setter
    capability: server.discovery
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
      - {name: enabled, type: bool, presence: required}
    returns: {type: void}
    # not_found: node_id names no component.
    # unsupported: the component exists but is not a server - the same use
    #   get_device_operation_modes makes of this code for a node that is not a
    #   device.
    # internal: mDNS advertising failed. The reference has exactly this path and
    #   treats it as a warning that does not undo anything: 'Server added but
    #   enable_discovery failed' (add_server_dialog.py:225).
    # invalid_value: error_policy's malformed_parameter_becomes - `enabled`
    #   arriving as the string "yes" rather than as a bool. `enabled` is THIS
    #   CONTRACT'S selector for which of two no-argument openDAQ methods to
    #   call, as this row's own header says; IServer::enableDiscovery
    #   (server.h:66) and disableDiscovery (:90) take no parameter, so "yes"
    #   selects neither and no SDK call can be made to raise about it. Neither
    #   not_found nor unsupported is honest there: nothing was looked up, and
    #   the server is perfectly capable of the operation that was mis-typed.
    errors: [not_found, unsupported, internal, invalid_value]
    naming_overrides: {}

  # --- the recorder ----------------------------------------------------------
  #
  # Whether a node IS a recorder, and whether it is recording now, are both
  # Node.recording, which carries that argument. These two rows are the two
  # halves of the reference's single Start/Stop button (recorder_view.py:90-106).

  - tokens: [start, recording]
    kind: action
    capability: recorder.control
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    # unsupported: the component exists and is not a recorder, i.e. the cast
    #   block_view.py:169 performs would fail. not_found: node_id names nothing.
    #   internal: IRecorder::startRecording threw - no writable path, a file
    #   already open, a device error - which is native text for error.detail.
    # invalid_value: error_policy's malformed_parameter_becomes - node_id
    #   arriving as null rather than as a string. IRecorder::startRecording
    #   (recorder.h:45) takes NO ARGUMENTS, and its one documented failure
    #   (recorder.h:41-43) is OPENDAQ_ERR_INVALIDSTATE for "already recording",
    #   so a malformed node_id cannot reach openDAQ at all and not_found would
    #   claim a lookup that never ran.
    errors: [not_found, unsupported, internal, invalid_value]
    naming_overrides: {}

  - tokens: [stop, recording]
    kind: action
    capability: recorder.control
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    errors: [not_found, unsupported, internal]
    naming_overrides: {}

  # --- batched property updates ----------------------------------------------
  #
  # IPropertyObject::beginUpdate and endUpdate, which the reference offers on
  # EVERY tree row: menu_update_items is in the function-block groups, the
  # device groups, the server groups and the fallback group alike
  # (gui_demo.py:998-1053). Between the two, setPropertyValue does not apply the
  # value; endUpdate applies everything set in between (property_object.h:330-349).
  #
  # THE STATE IS Node.updating, so a client knows before it calls which of the
  # two items is the live one, with no request.
  #
  # WHAT THIS CONTRACT DOES NOT RULE, stated so that nobody reads its silence as
  # an answer: WHO MAY END A BATCH. A batch is a property of the COMPONENT, not
  # of the socket that opened it - beginUpdate is recursive over child property
  # objects (property_object.h:335), so one begin on a device puts a subtree into
  # batch mode for every session at once, and a session that begins and then
  # drops leaves it there. Nothing here says whether a host must end an
  # abandoned batch when its opener disconnects, whether a second session may
  # end one it did not begin, or what either should answer.
  #
  # The device.lock rows above once carried the same open question and no longer
  # do: openDAQ answered it there, and the answer was that the lock is owned by
  # a USER and never by a session. Nothing in openDAQ scopes a batch to a
  # session either, so the same discipline applies to this pair - a host reports
  # what beginUpdate and endUpdate actually do and must not quietly invent a
  # session policy and call it the contract. Node.updating is what makes the
  # unruled state visible in the meantime.

  - tokens: [begin, batched, property, update]
    kind: action
    capability: property.batched_update
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    # not_found: node_id names no component. not_connected: no instance.
    # No unsupported: every openDAQ component is an IPropertyObject, which is
    # why the reference casts unconditionally (gui_demo.py:1369-1372) rather
    # than testing can_cast_from first as it does for IRecorder and IServer.
    # invalid_value: error_policy's malformed_parameter_becomes - node_id
    # arriving as [] rather than as a string. IPropertyObject::beginUpdate takes
    # no arguments and node_id exists here only to find the component, through
    # the same findComponent(IString*) path get_component_attributes uses, so a
    # list is not a component id in any sense openDAQ can be asked about.
    errors: [not_found, not_connected, invalid_value]
    naming_overrides: {}

  - tokens: [end, batched, property, update]
    kind: action
    capability: property.batched_update
    params:
      - {name: node_id, type: string, presence: required, references: Node.id}
    returns: {type: void}
    # invalid_value is this row's and not begin's: endUpdate raises when no
    # beginUpdate is open, and the reference swallows exactly that with a bare
    # `except RuntimeError: pass` (gui_demo.py:1374-1378). A call that arrives
    # out of order is the closed set's invalid_value - the request is
    # well-formed and the state refuses it - and Node.updating is what lets a
    # client avoid producing it. A host must not swallow it the way the
    # reference does: silence here would tell a user their batch was applied.
    errors: [not_found, not_connected, invalid_value]
    naming_overrides: {}

  # --- saving and loading the instance configuration -------------------------
  #
  # THE CONFIGURATION STRING CROSSES THE WIRE, in both directions. That is the
  # design decision of these two rows and it is in both of their names, the way
  # load_module_from_host_path puts its opposite decision in its own name. The
  # reference cannot settle it, because the reference is in-process:
  # handle_save_config_button_clicked opens a save dialog and writes
  # instance.save_configuration() into the chosen file, and
  # handle_load_config_button_clicked opens a file and hands its text to
  # LoadInstanceConfigDialog, which finally calls
  # instance.load_configuration(config_string, update_params)
  # (gui_demo.py:731-750, load_instance_config_dialog.py:542-545). The machine
  # holding the file is the machine holding the instance. Quackoscope splits
  # those across a socket, so the file is on one side and the instance on the
  # other, and the contract must say which side.
  #
  # THE ALTERNATIVE, and why it loses. A host-side path pair - save to a path on
  # the host's disk, load from one - is the shape load_module_from_host_path
  # took. Four grounds put this pair on the other side, and the first is
  # decisive:
  #
  # 1. WHO THE FILE IS FOR. A module is consumed by the HOST PROCESS: dlopen
  #    happens there, so the file must be there, and that is the whole reason
  #    load_module_from_host_path reads a host path. A configuration file is
  #    produced for and consumed by the USER, who is in a browser. Written to
  #    the host's disk it lands on a machine the user may have no shell on and
  #    no way to fetch from - "save my configuration" would mean "write a file
  #    somewhere you cannot reach". Same principle as the module row, opposite
  #    answer, because the consumer is at the other end.
  #
  # 2. openDAQ'S API IS A STRING IN BOTH DIRECTIONS, with no path overload:
  #    device.h:242 declares saveConfiguration(IString** configuration) - "Saves
  #    the configuration of the device to string" - and device.h:248 declares
  #    loadConfiguration(IString* configuration, IUpdateParameters* config).
  #    Under a path design every host would have to do file I/O openDAQ never
  #    asked for, and would need a writable directory it does not otherwise
  #    need. Under this design the host passes the wire string straight through.
  #
  # 3. THE PAYLOAD IS TEXT, so it needs no plane this contract does not have.
  #    The module row's second ground was that envelopes.request has no binary
  #    channel and section 9's frame is server-to-client with no correlation id.
  #    That ground simply does not apply to a JSON configuration: a string
  #    parameter and a string result are ordinary JSON, which envelopes.request
  #    and envelopes.result already carry.
  #
  # 4. THE CLIENT NEEDS THE STRING ANYWAY to draw the load screen. The
  #    reference's load window is built from the config text client-side -
  #    DeviceUpdateOptions(self.config_string) at
  #    load_instance_config_dialog.py:26, which yields the per-device rows the
  #    user edits before loading. A host-side path would put the file where the
  #    thing that needs to read it is not.
  #
  # THE FRAME LIMIT IS THE REAL COST OF THIS CHOICE, and it is not waved away.
  # handshake.limits.max_frame_bytes is declared per host and defaults to
  # 262144, and an instance configuration can exceed that. So:
  #   - On save, the HOST checks before it sends. A result it cannot fit inside
  #     its own declared limit is answered `internal`, whose detail states both
  #     numbers - the serialised length and max_frame_bytes - because a bare
  #     "failed" on this row would be indistinguishable from a broken instance.
  #   - On load, the CLIENT checks before it sends. A request frame over the
  #     limit may not arrive as a parseable envelope at all, in which case the
  #     host has no id to answer with and nothing can be reported; the client
  #     therefore measures the encoded request against the handshake's
  #     max_frame_bytes and refuses locally, naming both numbers, rather than
  #     sending a frame that can only vanish.
  # A host that expects large configurations declares a larger max_frame_bytes,
  # which is what that handshake field is for.

  - tokens: [save, instance, configuration, to, string]
    kind: getter
    capability: configuration.save
    params: []
    # The serialised configuration, whole, as openDAQ produced it. Opaque: no
    # client parses it, no client edits it, and this contract declares nothing
    # about its shape beyond it being the string saveConfiguration returned.
    returns: {type: string, semantic: opendaq_instance_configuration_json}
    # not_connected: no instance to serialise. internal: saveConfiguration
    #   threw, or the result does not fit this host's declared max_frame_bytes -
    #   see above; detail carries both byte counts.
    # Not not_found: this row names no node. Not read_only: nothing is written.
    errors: [not_connected, internal]
    naming_overrides: {}

  - tokens: [load, instance, configuration, from, string]
    kind: action
    capability: configuration.load
    params:
      # The text of a configuration previously produced by
      # save_instance_configuration_to_string, on this host or another.
      - {name: configuration, type: string, presence: required, semantic: opendaq_instance_configuration_json}
    # WHAT THIS ROW DOES NOT CARRY: the reference's UpdateParameters. Its load
    # window is a whole editable board over IUpdateParameters and a recursive
    # tree of IDeviceUpdateOptions - per device a LocalId, a Manufacturer, a
    # SerialNumber, a ConnectionString, an UpdateMode, and child_device_options
    # beneath (load_instance_config_dialog.py:304-384). This row loads with
    # openDAQ's default UpdateParameters, which is what loadConfiguration does
    # when its second argument is null (device.h:248) and what gui_demo.py's own
    # _load_config path does. Carrying the board would need a RECURSIVE record
    # type, and no type in section 3 nests a record inside itself or holds a
    # dictionary. Adding one to serve one screen is a larger decision than this
    # row, so it is named as missing here rather than guessed at.
    returns: {type: void}
    # invalid_value: the string is not a configuration openDAQ will load - not
    #   parseable, or describing devices this instance cannot reconcile. This is
    #   the likeliest answer a user will ever see from this row and the UI must
    #   render it as "the host would not load this file", not as a fault.
    # not_connected: no instance to load into.
    # internal: the string parsed and applying it threw partway.
    # Not not_found: no node is named. Not read_only: a locked device inside the
    #   instance is a refusal openDAQ raises during the load, which arrives as
    #   invalid_value or internal with the native text in detail; this row
    #   writes no single component that read_only could be about.
    errors: [not_connected, invalid_value, internal]
    naming_overrides: {}

# The control-plane subscription_id is a string; the binary frame header
# carries a uint32. The string is the decimal text of that uint32, whole, with
# nothing else in it. This is the only bridge between the two planes.
subscription_id_encoding:
  control_plane_type: string
  sample_plane_type: uint32
  relation: decimal_text_of_uint32
  strict: true
  on_unparseable: invalid_value

# ---------------------------------------------------------------------------
# 6. Events, server push
# ---------------------------------------------------------------------------
#
# Events carry no id field. They are not responses and are never correlated.

events:
  closed: true
  carries_id_field: false
  items:

    - tokens: [component, added]
      payload:
        - {name: node, type: Node, presence: required}

    - tokens: [component, removed]
      payload:
        - {name: node_id, type: string, presence: required, references: Node.id}

    - tokens: [property, changed]
      payload:
        - {name: node_id, type: string, presence: required, references: Node.id}
        - {name: property_id, type: string, presence: required, references: PropertyDescriptor.id}
        - {name: value, type: any, presence: required}

    - tokens: [property, descriptor, changed]
      payload:
        - {name: node_id, type: string, presence: required, references: Node.id}
        - {name: descriptor, type: PropertyDescriptor, presence: required}

    - tokens: [device, disconnected]
      payload:
        - {name: node_id, type: string, presence: required, references: Node.id}
        - {name: reason, type: string, presence: required}

# ---------------------------------------------------------------------------
# 7. Handshake
# ---------------------------------------------------------------------------
#
# The first message the server sends to the client, before any request is
# answered.

handshake:
  direction: server_to_client
  ordinal: 1
  fields:
    protocol_version:
      type: string
      presence: required
      const: "1.0"
    implementation:
      type: record
      presence: required
      fields:
        name:    {type: string, presence: required}
        version: {type: string, presence: required}
    sdk:
      type: record
      presence: required
      fields:
        version: {type: string, presence: required}
        commit:  {type: string, presence: required}
    capabilities:
      type: array
      items: string
      presence: required
      references: capabilities.id
    gaps:
      type: array
      items: Gap
      presence: required
    limits:
      type: record
      presence: required
      fields:
        max_subscriptions: {type: int, presence: required, default: 64}
        max_frame_bytes:   {type: int, presence: required, default: 262144}

# Host process names. implementation.name is DISPLAY ONLY.
implementation_names:
  pattern: quackoscope-host-<lang>
  values: [quackoscope-host-cpp, quackoscope-host-python, quackoscope-host-csharp, quackoscope-host-rust, quackoscope-host-mock]
  display_only: true
  behavioural_branch_allowed: false

# ---------------------------------------------------------------------------
# 8. Wire envelopes
# ---------------------------------------------------------------------------

envelopes:

  request:
    direction: client_to_server
    fields:
      id:     {type: int, presence: required, semantic: correlation_id}
      method: {type: string, presence: required, from: "operations[].tokens", join: snake_case}
      params: {type: object, presence: required}
    example: {id: 17, method: set_property_value, params: {}}

  result:
    direction: server_to_client
    fields:
      id:     {type: int, presence: required, semantic: correlation_id}
      result: {type: any, presence: nullable}
    discriminator: has_key_result
    example: {id: 17, result: null}

  error:
    direction: server_to_client
    fields:
      id:    {type: int, presence: required, semantic: correlation_id}
      error: {type: record, presence: required, fields_ref: error_shape}
    discriminator: has_key_error
    example: {id: 17, error: {code: read_only, detail: locked while acquiring}}

  event:
    direction: server_to_client
    fields:
      event:   {type: string, presence: required, from: "events.items[].tokens", join: snake_case}
      payload: {type: object, presence: required}
    discriminator: has_key_event
    example: {event: property_changed, payload: {}}

# ---------------------------------------------------------------------------
# 9. Binary sample frames
# ---------------------------------------------------------------------------
#
# Binary frames share the one socket with the JSON envelopes.

binary_frame:
  byte_order: little_endian
  header_bytes: 17
  header:
    - {name: subscription_id, type: uint32, offset: 0,  size: 4}
    - {name: domain_start,    type: uint64, offset: 4,  size: 8}
    - {name: sample_count,    type: uint32, offset: 12, size: 4}
    - {name: encoding,        type: uint8,  offset: 16, size: 1}
  encodings:
    - {value: 0, name: raw,               payload_value_type: float64, payload_value_count: sample_count,     interleave: none}
    - {value: 1, name: min_max_envelope,  payload_value_type: float64, payload_value_count: sample_count * 2, interleave: [min, max]}
  payload_offset: 17
  # 17 is odd, so the payload is not 8-byte aligned inside the received buffer.
  # A reader must copy the payload out rather than view it in place.
  payload_alignment_bytes: 1
  reader_must_copy_payload: true
  on_unknown_encoding: drop_frame
  on_truncated_frame: drop_frame

# ---------------------------------------------------------------------------
# 10. Lints the contract compiler enforces
# ---------------------------------------------------------------------------

lints:

  host_covers_every_operation:
    rule: every operation in `operations` has a handler in the host being built
    on_violation: fail_build
    message_must_name: the missing operation's wire method name

  no_undeclared_public_method:
    rule: a host exposes no public method whose wire name is absent from `operations`
    on_violation: fail_build
    message_must_name: the offending public method name

  naming_override_needs_reason:
    rule: every entry under operations[].naming_overrides carries a non-empty reason
    on_violation: fail_build

  naming_matches_symbol_coverage:
    rule: >-
      each generated symbol's name is checked against its covers_wire_methods
      list, not against a casing transform of a single wire name
    on_violation: fail_build

  error_code_closed_set:
    rule: every code in operations[].errors is a member of error_codes.values
    on_violation: fail_build

  capability_ids_resolve:
    rule: every operations[].capability is an id in `capabilities`
    on_violation: fail_build

  capability_operation_lists_agree:
    rule: >-
      capabilities[].operations and operations[].capability are two views of one
      mapping and must agree exactly in both directions
    on_violation: fail_build

  type_references_resolve:
    rule: every `type`, `items` and `references` names a primitive, a member of `types`, or an existing field path
    on_violation: fail_build

  reserved_word_escaped:
    rule: >-
      a wire name colliding with a target's reserved_words is emitted through
      that target's reserved_word_strategy, never verbatim
    on_violation: fail_build

  golden_files:
    rule: generator output is compared against checked-in golden files per target
    on_violation: fail_build
    path: tools/contract-compiler/golden/<target>/

primitives: [string, int, float, number, bool, any, void, object, array, record, enum, binary_frame, uint8, uint32, uint64, float64]
